version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: barbearia-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - barbearia-network

  db:
    image: postgres:16-alpine
    container_name: barbearia-db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barbearia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-barbearia123}
      POSTGRES_DB: ${POSTGRES_DB:-barbearia_comanda}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-barbearia} -d ${POSTGRES_DB:-barbearia_comanda}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barbearia-network

networks:
  barbearia-network:
    driver: bridge

volumes:
  postgres_data:
